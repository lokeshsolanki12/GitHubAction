name: "Multi Event Pipeline / workflow"
on:
    push:
        branches:
            - main
            - test
    pull_request:
        branches:
            - main
    workflow_dispatch:


jobs:
    on-push:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - name: "Running on test push"
              run: echo "Running on main push"
            - name: "Print date "
              run: date
    on-pull-request:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: "Running on pull request"
              run: echo "Runing on pull request"