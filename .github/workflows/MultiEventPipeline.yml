name: "Multi Event Pipeline / workflow"
on:
    push:
        branches:
            - main
            - test
    pull_request:
        branches:
            - main
        types:
            - closed
            - opened
    workflow_dispatch:
    


jobs:
    on-push:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - name: "Running on test push"
              run: echo "Running on main push"
            - name: "Print date "
              run: date
    on-pull-request:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: "Running on pull request"
              run: echo "Runing on pull request"
    on-pull-request-opened:
        if: github.event_name == 'pull_request' &&  github.event.action == 'opened'
        runs-on: ubuntu-latest
        steps:
            - name: "Running on pull request opened"
              run: echo "Running pull request opened"

    on-pull-request-closed:
        if: github.event_name == 'pull_request' &&  github.event.action == 'closed'
        runs-on: ubuntu-latest
        steps:
            - name: "Running on pull request closed"
              run: echo "Running pull request closed"

    on-workflow-dispatch:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        steps:
            - name: "runing on workflow dispatch"
              run: echo "Runing on workflow dispatch"   